<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0A0A0C" />
<meta name="description" content="Mercury — a premium training log: workouts, progression, nutrition and body." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mercury" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Mercury</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&display=swap" />
<script>
  // Theme + accent before first paint (no flash)
  try {
    var s = JSON.parse(localStorage.getItem("mercury_v1") || "{}").settings || {};
    var p = s.theme || "auto";
    var d = p === "dark" || (p === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", d ? "dark" : "light");
    document.documentElement.setAttribute("data-accent", s.accent || "volt");
  } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
</script>
<style>/*__CSS__*/</style>
</head>
<body>
<div id="root"></div>
<script>/*__JS__*/</script>
</body>
</html>
